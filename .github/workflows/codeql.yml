name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, catches newly published query packs

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read # CodeQL reads the workflow run for status reporting
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version: stable
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
      # Build with the sdk tag so the real backend is analyzed too (default build skips it).
      - name: Build
        if: matrix.language == 'go'
        run: CGO_ENABLED=1 go build -tags sdk ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
